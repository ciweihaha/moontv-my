name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # 仓库提交了 package-lock.json，直接 npm ci 冻结安装，保证依赖可复现。
        # 旧流程用 pnpm 并按需临时生成锁文件，已弃用。
        run: npm ci

      - name: Test
        # package.json 含 test 脚本（jest）：CI 执行它
        run: npm test -- --ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
