name = "moontv"
compatibility_date = "2024-01-01"

[vars]
# 与 src/lib/db.ts 默认 'localstorage' 保持一致（原为 "d1" 口径不一致）
NEXT_PUBLIC_STORAGE_TYPE = "localstorage"
SITE_NAME = "MoonTV"

[[d1_databases]]
binding = "DB"
database_name = "moontv-db"
database_id = "YOUR_D1_DATABASE_ID"

[build]
command = "pnpm install && pnpm gen:runtime && pnpm gen:manifest && pnpm build"
watch_dir = "src"

[dev]
port = 8787
local_protocol = "http"
